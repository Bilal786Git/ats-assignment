version: "3.8"

services:
  postgres:
    image: postgres:17
    container_name: ats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ats-postgres-data:/var/lib/postgresql/data

volumes:
  ats-postgres-data:
